name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Start Cosmos DB emulator
        run: |
          docker run -d --name cosmos -p 8081:8081 \
            mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview --protocol http

      - name: Start Azurite (Azure Storage emulator, product photos)
        run: |
          docker run -d --name azurite -p 10000:10000 \
            mcr.microsoft.com/azure-storage/azurite:3.37.0 azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck

      - name: Restore
        run: dotnet restore IPLMerchandiseStore.sln

      - name: Build
        run: dotnet build IPLMerchandiseStore.sln -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/IPLMerchandise.UnitTests -c Release --no-build --logger trx --results-directory TestResults

      - name: Front-end component tests (bUnit)
        run: dotnet test tests/IPLMerchandise.Web.Tests -c Release --no-build --logger trx --results-directory TestResults

      - name: Wait for emulator
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8081/ >/dev/null && exit 0
            sleep 2
          done
          docker logs cosmos; exit 1

      - name: API and integration tests (Cosmos emulator + Azurite)
        run: dotnet test tests/IPLMerchandise.IntegrationTests -c Release --no-build --logger trx --results-directory TestResults

      - name: Container images build
        run: docker compose build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
